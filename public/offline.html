<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekdeck | Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        border-radius: 8px;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        line-height: 1.5;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="56" height="56" />
      <h1>You're offline</h1>
      <p>Reconnect to open your Weekdeck planner.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
